# ==============================================================================
# Vanguard Foundry - Systemd Drop-in Override Configuration for Ollama Daemon
# Location: /etc/systemd/system/ollama.service.d/override.conf
# ==============================================================================

[Service]
# Performance & High-Throughput Hardware Flags
Environment="OLLAMA_FLASH_ATTENTION=1"
Environment="OLLAMA_IGPU_ENABLE=1"
Environment="OLLAMA_KV_CACHE_TYPE=f16"
Environment="OLLAMA_KEEP_ALIVE=30m"
Environment="OLLAMA_NUM_PARALLEL=1"
Environment="OLLAMA_CONTEXT_LENGTH=8192"

# Air-Gapped Network Isolation
Environment="OLLAMA_ORIGINS=*"
Environment="OLLAMA_NO_CLOUD=1"
Environment="OLLAMA_NOPRUNE=1"

# AMD ROCm APU Architecture Target (Uncomment for AMD Phoenix/Hawk Point/Radeon 780M)
# Environment="HSA_OVERRIDE_GFX_VERSION=11.0.0"
# Environment="ROCM_PATH=/opt/rocm"
