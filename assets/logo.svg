<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" width="100%" height="100%">
  <defs>
    <!-- Background Gradients -->
    <radialGradient id="nebula-purple" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#9d5cff" stop-opacity="0.32" />
      <stop offset="55%" stop-color="#3b1566" stop-opacity="0.14" />
      <stop offset="100%" stop-color="#0a0512" stop-opacity="0" />
    </radialGradient>
    
    <radialGradient id="nebula-cyan" cx="50%" cy="52%" r="40%">
      <stop offset="0%" stop-color="#5ffbf1" stop-opacity="0.25" />
      <stop offset="60%" stop-color="#22666a" stop-opacity="0.08" />
      <stop offset="100%" stop-color="#0a0512" stop-opacity="0" />
    </radialGradient>

    <!-- Linear Metallic Alien Gradients -->
    <linearGradient id="formline-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#d8c6ff" />
      <stop offset="35%" stop-color="#c084fc" />
      <stop offset="70%" stop-color="#9d5cff" />
      <stop offset="100%" stop-color="#4c1d95" />
    </linearGradient>

    <linearGradient id="formline-cyan" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0d9488" />
      <stop offset="50%" stop-color="#2dd4bf" />
      <stop offset="100%" stop-color="#5ffbf1" />
    </linearGradient>

    <linearGradient id="visor-glass" x1="50%" y1="0%" x2="50%" y2="100%">
      <stop offset="0%" stop-color="#2a124a" stop-opacity="0.85" />
      <stop offset="60%" stop-color="#150824" stop-opacity="0.92" />
      <stop offset="100%" stop-color="#080310" stop-opacity="0.98" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glow-cyan" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="glow-purple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .primary-formline { fill: url(#formline-purple); }
    .secondary-formline { fill: url(#formline-cyan); }
    .cockpit-hull { fill: url(#visor-glass); stroke: #9d5cff; stroke-width: 1.5; stroke-opacity: 0.5; }
    .hud-line { stroke: #5ffbf1; stroke-width: 1.2; stroke-dasharray: 4 6; opacity: 0.65; }
    .accent-glow { fill: #5ffbf1; filter: url(#glow-cyan); }
  </style>

  <!-- Void Background with Ambient Nebulae -->
  <rect width="800" height="500" rx="16" fill="#0a0512" />
  <circle cx="400" cy="230" r="240" fill="url(#nebula-purple)" />
  <circle cx="400" cy="250" r="150" fill="url(#nebula-cyan)" />

  <!-- Cockpit HUD Reticle Grid (Subtle Background Geometry) -->
  <circle cx="400" cy="240" r="170" fill="none" stroke="#9d5cff" stroke-width="0.8" stroke-opacity="0.25" />
  <circle cx="400" cy="240" r="120" fill="none" stroke="#5ffbf1" stroke-width="0.7" stroke-opacity="0.3" stroke-dasharray="3 7" />
  <circle cx="400" cy="240" r="50" fill="none" stroke="#5ffbf1" stroke-width="1" stroke-opacity="0.4" />
  
  <line x1="210" y1="240" x2="350" y2="240" class="hud-line" />
  <line x1="450" y1="240" x2="590" y2="240" class="hud-line" />
  <line x1="400" y1="90" x2="400" y2="190" class="hud-line" />
  <line x1="400" y1="290" x2="400" y2="390" class="hud-line" />

  <!-- ========================================================================
       ABSTRACT FORMLINE COCKPIT ARCHITECTURE (Non-Symbolic Geometry)
       ======================================================================== -->

  <!-- Top Outer Canopy Arch (Primary Formline: Sweeping curve with tapering thickness) -->
  <path class="primary-formline" filter="url(#glow-purple)"
        d="M 170 300
           C 220 180, 310 110, 400 110
           C 490 110, 580 180, 630 300
           C 570 230, 490 148, 400 148
           C 310 148, 230 230, 170 300 Z" />

  <!-- Cockpit Inner Visor Shield (Glassmorphic Hull) -->
  <path class="cockpit-hull"
        d="M 230 280
           C 270 190, 330 156, 400 156
           C 470 156, 530 190, 570 280
           C 515 320, 465 336, 400 336
           C 335 336, 285 320, 230 280 Z" />

  <!-- Formline Central Ovoid (Abstract Canopy Core) -->
  <!-- Outer Ovoid Perimeter -->
  <path class="primary-formline"
        d="M 310 240
           C 310 185, 345 168, 400 168
           C 455 168, 490 185, 490 240
           C 490 290, 455 312, 400 312
           C 345 312, 310 290, 310 240 Z
           M 336 240
           C 336 274, 360 292, 400 292
           C 440 292, 464 274, 464 240
           C 464 204, 440 188, 400 188
           C 360 188, 336 204, 336 240 Z" />

  <!-- Inner Cyan Ovoid Eye / Instrument Focus -->
  <path class="secondary-formline" filter="url(#glow-cyan)"
        d="M 355 240
           C 355 218, 372 206, 400 206
           C 428 206, 445 218, 445 240
           C 445 260, 428 274, 400 274
           C 372 274, 355 260, 355 240 Z
           M 374 240
           C 374 250, 384 258, 400 258
           C 416 258, 426 250, 426 240
           C 426 230, 416 222, 400 222
           C 384 222, 374 230, 374 240 Z" />

  <!-- Left Formline Lateral U-Form (Cockpit Wing Flank) -->
  <path class="primary-formline"
        d="M 180 290
           C 195 245, 235 220, 280 220
           C 288 234, 290 248, 276 256
           C 246 256, 222 272, 210 296
           C 232 292, 256 294, 270 306
           C 246 324, 206 322, 180 290 Z" />

  <!-- Right Formline Lateral U-Form (Cockpit Wing Flank) -->
  <path class="primary-formline"
        d="M 620 290
           C 605 245, 565 220, 520 220
           C 512 234, 510 248, 524 256
           C 554 256, 578 272, 590 296
           C 568 292, 544 294, 530 306
           C 554 324, 594 322, 620 290 Z" />

  <!-- Lower Formline Tapering Cradle (Instrument Console Base) -->
  <path class="secondary-formline"
        d="M 270 326
           C 320 348, 360 356, 400 356
           C 440 356, 480 348, 530 326
           C 490 342, 445 348, 400 348
           C 355 348, 310 342, 270 326 Z" />

  <!-- Floating Telemetry S-Form Micro-Accents -->
  <path fill="#5ffbf1" opacity="0.8"
        d="M 295 190
           C 285 178, 268 184, 260 194
           C 268 190, 280 190, 288 198
           C 292 202, 298 198, 295 190 Z" />
           
  <path fill="#5ffbf1" opacity="0.8"
        d="M 505 190
           C 515 178, 532 184, 540 194
           C 532 190, 520 190, 512 198
           C 508 202, 502 198, 505 190 Z" />

  <!-- Central Flight Vector Spores -->
  <circle cx="400" cy="240" r="3.5" class="accent-glow" />
  <circle cx="370" cy="240" r="2" fill="#5ffbf1" opacity="0.7" />
  <circle cx="430" cy="240" r="2" fill="#5ffbf1" opacity="0.7" />
  
  <!-- Subtle Typographic Sub-Title (Monospace Code Aesthetics) -->
  <text x="400" y="420" text-anchor="middle" font-family="'Cascadia Code', 'SFMono-Regular', monospace" font-size="13" letter-spacing="0.32em" fill="#ede6ff">
    O L L A M A   V A N G U A R D
  </text>
  <text x="400" y="442" text-anchor="middle" font-family="'Cascadia Code', 'SFMono-Regular', monospace" font-size="9" letter-spacing="0.22em" fill="#a996d6" opacity="0.75">
    UNIVERSAL ARCHITECTURE &amp; ARTIFACT FOUNDRY
  </text>
</svg>
